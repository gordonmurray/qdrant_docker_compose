global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    default-server init-addr last,libc,none inter 5s fall 3 rise 2

# Docker's DNS resolver, so nodes can restart and change IP.
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s

frontend rest
    bind :6333
    default_backend qdrant_rest

backend qdrant_rest
    balance roundrobin
    option httpchk GET /readyz
    http-check expect status 200
    default-server resolvers docker check
    server qdrant-1 qdrant-1:6333
    server qdrant-2 qdrant-2:6333
    server qdrant-3 qdrant-3:6333

frontend grpc
    bind :6334
    mode tcp
    option tcplog
    default_backend qdrant_grpc

backend qdrant_grpc
    mode tcp
    balance roundrobin
    # Health is judged by the REST readiness endpoint on each node.
    option httpchk GET /readyz
    http-check expect status 200
    default-server resolvers docker check port 6333
    server qdrant-1 qdrant-1:6334
    server qdrant-2 qdrant-2:6334
    server qdrant-3 qdrant-3:6334

frontend stats
    bind :8404
    stats enable
    stats uri /
    stats refresh 5s
    http-request use-service prometheus-exporter if { path /metrics }
