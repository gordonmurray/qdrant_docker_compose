global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: qdrant
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/qdrant_api_key
    static_configs:
      - targets: [qdrant-1:6333]
        labels: { node: qdrant-1 }
      - targets: [qdrant-2:6333]
        labels: { node: qdrant-2 }
      - targets: [qdrant-3:6333]
        labels: { node: qdrant-3 }

  - job_name: haproxy
    static_configs:
      - targets: [haproxy:8404]

  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
